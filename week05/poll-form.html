<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form- user poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
    <header>
        <h1>WDD 130 | Gift Agbiji | HTML Form- user poll </h1>

    </header>
    <main>
        <form action="">
            <fieldset>
                
                <legend>Contact Information</legend>
                <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
                </div>
            <div class="form-item column2">
                <label for="email">Email:</label>
                <input type="email" id="useremail" name="useremail">
            </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1">
                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="microsoft-edge">Microsoft Edge</option>
                </select>
            </div>
            <div class="form-item column1">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" name="pet" id="pet">
            </div>
            <div class="form-item">
                <label for="places">List the places you have lived</label>
                <textarea name="feedback" id="feedback" rows="5" placeholder="Nigeria, Ghana, South Africa, Mali"></textarea>
                </div>
            </fieldset>
            <button type="submit"> submit poll</button>
        </form>

    </main>
    <footer>
        <p>&copy;2025 | HTML Form- User Poll Activity | Agbijigift</p>

    </footer>
    
</body>
</html>
